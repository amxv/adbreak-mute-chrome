<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adbreak Mute</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Adbreak Mute</h1>

      <label class="toggle-row" for="enable-toggle">
        <span>Enable extension</span>
        <input id="enable-toggle" type="checkbox" />
      </label>

      <div class="actions">
        <button id="monitor-btn" type="button">Start monitoring current tab</button>
        <button id="options-btn" type="button">Open calibration/options</button>
      </div>

      <div class="status-grid">
        <p><span>Monitored:</span> <strong id="monitored-line">None</strong></p>
        <p><span>Logo:</span> <strong id="logo-line">Unknown</strong></p>
        <p><span>Muted:</span> <strong id="muted-line">Unknown</strong></p>
        <p><span>Decision:</span> <strong id="decision-line">Idle</strong></p>
      </div>

      <p id="status-line" class="status">Loading status...</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
